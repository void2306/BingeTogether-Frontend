name: React Frontend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Code from GitHub
        uses: actions/checkout@v3

      - name: 2. Set up Node.js 20
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: 3. Install Dependencies
        run: npm install

      - name: 4. Build React App
        run: npm run build